<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Atividades do CEU</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
      :root {
        --bg-color: #f4f7f6;
        --card-bg: #ffffff;
        --text-main: #2d3748;
        --text-muted: #718096;
        --border-color: #e2e8f0;
        --header-color: #2b6cb0;
        --input-bg: #ffffff;
        --shadow: 0 4px 20px rgba(0,0,0,0.05);
        --accent: #ed8936;
      }

      body.dark-mode {
        --bg-color: #1a202c;
        --card-bg: #2d3748;
        --text-main: #e2e8f0;
        --text-muted: #a0aec0;
        --border-color: #4a5568;
        --header-color: #63b3ed;
        --input-bg: #1a202c;
        --shadow: 0 4px 20px rgba(0,0,0,0.3);
      }

      body { font-family: 'Nunito', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px 12px; transition: 0.3s; }
      .container { max-width: 1200px; margin: 0 auto; }

      /* CABEÇALHO ESTILO PORTAL COM LOGO */
      .hero-header { background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 24px; border-top: 5px solid var(--header-color); }
      .hero-brand { display: flex; align-items: center; gap: 15px; }
      .hero-brand img { max-height: 60px; width: auto; border-radius: 8px; object-fit: contain; } /* Formatação do Logo */
      .hero-titles h1 { color: var(--header-color); margin: 0; font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
      .hero-titles p { color: var(--text-muted); margin: 5px 0 0 0; font-size: 15px; font-weight: 600; }
      
      .top-actions { display: flex; gap: 10px; }
      .btn-docs, .btn-theme { background: var(--header-color); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-size: 14px; }
      .btn-theme { background: var(--card-bg); color: var(--header-color); border: 2px solid var(--header-color); }
      .btn-docs:hover { background: #2c5282; transform: translateY(-2px); }
      .btn-theme:hover { background: var(--header-color); color: white; }

      /* ÁREA DE FILTROS */
      .filters-container { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 24px; }
      .filters-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
      select { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: var(--text-main); background: var(--input-bg); cursor: pointer; transition: 0.2s; }
      select:focus { border-color: var(--header-color); outline: none; }

      .search-bar { display: flex; gap: 10px; flex-wrap: wrap; }
      .search-bar input { flex: 1; min-width: 200px; padding: 12px 15px; border: 2px solid var(--border-color); border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 600; background: var(--input-bg); color: var(--text-main); }
      .search-bar input:focus { border-color: var(--header-color); outline: none; }
      
      .days-inline { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
      .day-btn { padding: 8px 12px; border: 2px solid var(--border-color); border-radius: 10px; background: var(--card-bg); color: var(--text-muted); font-weight: 800; font-size: 12px; cursor: pointer; transition: 0.2s; }
      .day-btn:hover { border-color: var(--accent); color: var(--accent); }
      .day-btn.active { background-color: var(--accent); color: white; border-color: var(--accent); }
      
      .btn-buscar { padding: 12px 24px; background: var(--header-color); color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
      .btn-buscar:hover { transform: scale(1.05); }

      /* GRID DE CARDS */
      .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
      .card { background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); transition: 0.3s; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
      .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: var(--header-color); }
      
      .card-header { background: linear-gradient(135deg, rgba(43,108,176,0.1), rgba(99,179,237,0.1)); padding: 20px; border-bottom: 1px solid var(--border-color); }
      .card-category { font-size: 11px; text-transform: uppercase; font-weight: 800; color: var(--header-color); letter-spacing: 1px; margin-bottom: 8px; display: flex; justify-content: space-between; }
      .card-title { margin: 0; font-size: 20px; font-weight: 800; color: var(--text-main); line-height: 1.2; }
      
      .card-body { padding: 20px; flex: 1; }
      .info-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; font-size: 14px; color: var(--text-main); }
      .info-row i { color: var(--text-muted); font-size: 16px; width: 20px; text-align: center; margin-top: 3px; }
      .info-row strong { color: var(--text-muted); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
      
      .card-footer { padding: 15px 20px; background: rgba(0,0,0,0.02); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
      .badge-dias { background: #bee3f8; color: #2a4365; padding: 6px 10px; border-radius: 8px; font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; width: fit-content; }
      .badge-hora { color: var(--text-muted); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }

      /* MODAL */
      .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
      .modal-content { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); position: relative; }
      .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; font-weight: bold; color: var(--text-muted); cursor: pointer; }
      .modal-title { color: var(--header-color); font-size: 22px; font-weight: 800; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;}
      
      .loading, .no-results { text-align: center; font-weight: 800; font-size: 16px; padding: 40px 20px; border-radius: 16px; background: var(--card-bg); box-shadow: var(--shadow); }
      .loading { color: var(--header-color); }
      .no-results { color: #e53e3e; }

      @media (max-width: 768px) {
        .hero-header { flex-direction: column; align-items: flex-start; }
        .top-actions { width: 100%; }
        .btn-docs, .btn-theme { flex: 1; justify-content: center; }
        .search-bar { flex-direction: column; }
        .days-inline { justify-content: space-between; width: 100%; }
        .day-btn { flex: 1; text-align: center; }
        .btn-buscar { width: 100%; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <!-- HERO HEADER -->
      <div class="hero-header">
        <div class="hero-brand">
          <!-- LOGOTIPO: Substitua o link do 'src' pela URL da imagem do logotipo real do CEU se preferir. -->
          <img src="https://via.placeholder.com/80/2b6cb0/ffffff?text=CEU" alt="Logo CEU Caminho do Mar" id="logo-ceu">
          <div class="hero-titles">
            <h1>CEU Caminho do Mar</h1>
            <p>Cursos, Atividades e Vagas Abertas</p>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn-docs" onclick="abrirModal()"><i class="fas fa-file-signature"></i> Como me matricular?</button>
          <button class="btn-theme" onclick="alternarTema()"><i id="icone-tema" class="fas fa-moon"></i></button>
        </div>
      </div>

      <!-- ÁREA DE FILTROS -->
      <div class="filters-container">
        <div class="filters-row">
          <select id="comboModalidade" onchange="pesquisar()">
            <option value="">🎯 Modalidade (Todas)</option>
          </select>
          <select id="comboNucleo" onchange="pesquisar()">
            <option value="">🏢 Núcleo (Todos)</option>
          </select>
          <select id="comboProfessor" onchange="pesquisar()">
            <option value="">👨‍🏫 Professor(a) (Todos)</option>
          </select>
          <select id="comboEspaco" onchange="pesquisar()">
            <option value="">📍 Espaço (Todos)</option>
          </select>
        </div>

        <div class="search-bar">
          <input type="text" id="termo" placeholder="🔍 Buscar por nome da atividade..." onkeypress="verificarEnter(event)">
          <div class="days-inline">
            <button class="day-btn" onclick="toggleDia('DOM', this)">DOM</button>
            <button class="day-btn" onclick="toggleDia('SEG', this)">SEG</button>
            <button class="day-btn" onclick="toggleDia('TER', this)">TER</button>
            <button class="day-btn" onclick="toggleDia('QUA', this)">QUA</button>
            <button class="day-btn" onclick="toggleDia('QUI', this)">QUI</button>
            <button class="day-btn" onclick="toggleDia('SEX', this)">SEX</button>
            <button class="day-btn" onclick="toggleDia('SAB', this)">SAB</button>
          </div>
          <button class="btn-buscar" onclick="pesquisar()">Filtrar</button>
        </div>
      </div>
      
      <!-- LOCAL ONDE OS CARDS VÃO APARECER -->
      <div id="resultado"></div>

    </div>

    <!-- MODAL DE DOCUMENTOS -->
    <div id="modalDocumentos" class="modal">
      <div class="modal-content">
        <span class="close-modal" onclick="fecharModal()">&times;</span>
        <h3 class="modal-title"><i class="fas fa-info-circle"></i> Orientações para Matrícula</h3>
        <div id="texto-regras-documentos" style="color: var(--text-main); font-size: 15px; line-height: 1.8; margin-bottom: 25px;">
           <i>Conectando com a secretaria...</i>
        </div>
        <button class="btn-buscar" style="width: 100%; justify-content: center;" onclick="fecharModal()">Entendi!</button>
      </div>
    </div>

    <script>
      // ⚠️ COLE A SUA URL AQUI, E SOMENTE AQUI!
      const API_URL = "COLE_SEU_LINK_DO_WEB_APP_AQUI"; 

      let diasSelecionados = [];

      function alternarTema() {
        document.body.classList.toggle('dark-mode');
        const icone = document.getElementById('icone-tema');
        icone.classList.toggle('fa-moon');
        icone.classList.toggle('fa-sun');
      }

      function abrirModal() { document.getElementById('modalDocumentos').style.display = 'flex'; }
      function fecharModal() { document.getElementById('modalDocumentos').style.display = 'none'; }
      function verificarEnter(event) { if (event.key === 'Enter') pesquisar(); }
      
      function toggleDia(dia, btn) {
        btn.classList.toggle('active');
        if (diasSelecionados.includes(dia)) { diasSelecionados = diasSelecionados.filter(d => d !== dia); } 
        else { diasSelecionados.push(dia); }
        pesquisar();
      }

      document.addEventListener("DOMContentLoaded", function() {
        // A lógica de erro foi restaurada para testar o texto padrão vazio.
        if(API_URL === "COLE_SEU_LINK_DO_WEB_APP_AQUI") {
            document.getElementById('resultado').innerHTML = "<div class='no-results'>⚠️ Configure o link do Web App no código HTML!</div>";
            return;
        }

        fetch(API_URL + "?acao=buscarCombos")
          .then(resposta => resposta.json())
          .then(dados => preencherCombos(dados))
          .catch(erro => console.log("Erro: ", erro));
      });

      function preencherCombos(opcoes) {
        const comboMod = document.getElementById('comboModalidade');
        opcoes.modalidades.forEach(mod => comboMod.appendChild(new Option(mod, mod)));

        const comboNuc = document.getElementById('comboNucleo');
        opcoes.nucleos.forEach(nuc => comboNuc.appendChild(new Option(nuc, nuc)));

        const comboProf = document.getElementById('comboProfessor');
        opcoes.professores.forEach(prof => {
          comboProf.appendChild(new Option(prof.nome, prof.nome));
        });

        const comboEsp = document.getElementById('comboEspaco');
        opcoes.espacos.forEach(esp => comboEsp.appendChild(new Option(esp, esp)));

        if (opcoes.regras) {
           document.getElementById('texto-regras-documentos').innerHTML = opcoes.regras.replace(/\n/g, '<br>');
        }
        
        pesquisar();
      }

      function pesquisar() {
        var termo = document.getElementById('termo').value;
        var modSelecionada = document.getElementById('comboModalidade').value;
        var nucSelecionado = document.getElementById('comboNucleo').value;
        var profSelecionado = document.getElementById('comboProfessor').value;
        var espSelecionado = document.getElementById('comboEspaco').value;
        
        document.getElementById('resultado').innerHTML = "<div class='loading'><i class='fas fa-spinner fa-spin fa-2x' style='margin-bottom: 15px;'></i><br>Buscando turmas...</div>";
        
        const params = new URLSearchParams({
          acao: 'buscarDados',
          termo: termo,
          dias: JSON.stringify(diasSelecionados),
          prof: profSelecionado,
          mod: modSelecionada,
          nuc: nucSelecionado,
          esp: espSelecionado
        });

        fetch(API_URL + "?" + params.toString())
          .then(resposta => resposta.json())
          .then(dados => mostrarResultados(dados))
          .catch(erro => {
            document.getElementById('resultado').innerHTML = "<div class='no-results'>Erro de comunicação com a planilha.</div>";
          });
      }

      function mostrarResultados(dados) {
        const container = document.getElementById('resultado');
        
        if (dados.length == 0) {
          container.innerHTML = "<div class='no-results'><i class='fas fa-search' style='font-size:30px; display:block; margin-bottom:15px; color:#e2e8f0;'></i>Nenhuma turma encontrada com estes filtros.</div>";
          return;
        }

        let html = '<div class="cards-grid">';
        
        dados.forEach(turma => {
          const diasFormatados = turma.dias ? `<span class='badge-dias'><i class="far fa-calendar-check"></i> ${turma.dias}</span>` : "";
          const horaFormatada = turma.horario ? `<span class='badge-hora'><i class='far fa-clock'></i> ${turma.horario}</span>` : "";
          const profTexto = turma.professor || "A definir";
          const espacoTexto = turma.espaco || "Local a definir";
          const nucleoTexto = turma.nucleo || "Atividade Geral";
          const sufixoTexto = turma.sufixo ? ` - ${turma.sufixo}` : "";
          const numTurma = turma.turma ? `Turma ${turma.turma}` : "";

          html += `
            <div class="card">
              <div class="card-header">
                <div class="card-category">
                  <span>${nucleoTexto}</span>
                  <span>${numTurma}</span>
                </div>
                <h3 class="card-title">${turma.modalidade || "Atividade"}${sufixoTexto}</h3>
              </div>
              <div class="card-body">
                <div class="info-row">
                  <i class="fas fa-chalkboard-teacher"></i>
                  <div>
                    <strong>Professor(a)</strong>
                    ${profTexto}
                  </div>
                </div>
                <div class="info-row">
                  <i class="fas fa-map-marker-alt"></i>
                  <div>
                    <strong>Espaço / Local</strong>
                    ${espacoTexto}
                  </div>
                </div>
              </div>
              <div class="card-footer">
                ${diasFormatados ? `<div>${diasFormatados}</div>` : ''}
                ${horaFormatada ? `<div>${horaFormatada}</div>` : ''}
              </div>
            </div>
          `;
        });

        html += '</div>';
        container.innerHTML = html;
      }
    </script>
  </body>
</html>

      .badge-dias { background-color: #bee3f8; color: #2a4365; padding: 4px 8px; border-radius: 6px; font-weight: 800; font-size: 11px; margin-right: 4px; display: inline-block; white-space: nowrap; }
      .badge-hora { color: var(--text-muted); font-weight: 700; font-size: 12px; white-space: nowrap; }

      @media (max-width: 600px) {
        .top-header { flex-direction: column; align-items: flex-start; }
        .top-actions { width: 100%; justify-content: space-between; margin-top: 8px; }
        .search-days-box { flex-direction: column; align-items: stretch; }
        .days-inline { justify-content: space-between; }
        .btn-buscar { width: 100%; text-align: center; }
      }

  <body>

        <select id="comboCeuMestre" onchange="trocarCeu()" style="flex: 1; border: 2px solid #63b3ed; background: white; font-size: 14px; color: #2b6cb0; font-weight: 800; padding: 6px 12px; cursor: pointer;">

        <div class="days-inline">
          <button class="day-btn" onclick="toggleDia('DOM', this)">DOM</button>

        ✌️ Escolha uma opção nos filtros acima ou digite algo para buscar!

<!-- MODAL DE DOCUMENTOS DINÂMICO -->

        <!-- O container invisível que receberá o texto da G1 -->

           <i>Aguarde, carregando as regras da unidade...</i>

    <script>
      const LINK_DO_GOOGLE = "https://script.google.com/macros/s/AKfycbyUqh6yg6wKCHPL4LzIA3kS5y7d2Md0Ll9P9zG5tue3km-25q636qAwDodXpVE2nCSf/exec";
      const API_URL = LINK_DO_GOOGLE + "?api=sim";

      let diasSelecionados = [];
      let dicionarioCEUs = {}; // Vai armazenar todos os dados visuais da Master

      function alternarTema() {
        document.body.classList.toggle('dark-mode');
        const icone = document.getElementById('icone-tema');
        if (document.body.classList.contains('dark-mode')) {
          icone.classList.replace('fa-moon', 'fa-sun');
        } else {
          icone.classList.replace('fa-sun', 'fa-moon');
        }
      }

      function abrirModal() { document.getElementById('modalDocumentos').style.display = 'flex'; }
      function fecharModal() { document.getElementById('modalDocumentos').style.display = 'none'; }
      function verificarEnter(event) { if (event.key === 'Enter') pesquisar(); }
      function toggleDia(dia, btn) {
        btn.classList.toggle('active');
        if (diasSelecionados.includes(dia)) { diasSelecionados = diasSelecionados.filter(d => d !== dia); } 
        else { diasSelecionados.push(dia); }
        pesquisar();
      }

// ====================================================
      // CONEXÃO BLINDADA (POST) COM A PLANILHA MASTER
      // ====================================================
      document.addEventListener("DOMContentLoaded", function() {
        // 1. Busca os dados visuais e a lista de CEUs usando POST (o padrão seguro do sistema)
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ acao: "obterListaCEUsMaster", dados: {} })
        })
          .then(resposta => resposta.json())
          .then(retorno => {
            if (retorno.status === "sucesso") {
              dicionarioCEUs = retorno.ceus;
              const comboMestre = document.getElementById('comboCeuMestre');
              comboMestre.innerHTML = '<option value="">-- Selecione uma Unidade --</option>';

              // Ordena em Ordem Alfabética
              let arrayCeus = Object.keys(dicionarioCEUs).map(id => ({ id: id, nome: dicionarioCEUs[id].nome }));
              arrayCeus.sort((a, b) => a.nome.localeCompare(b.nome));

              arrayCeus.forEach(ceu => {
                comboMestre.appendChild(new Option(ceu.nome, ceu.id));
              });

              // Seleciona Caminho do Mar (700039) como padrão se existir
              if (dicionarioCEUs["700039"]) {
                comboMestre.value = "700039";
                trocarCeu();
              }
            } else {
              document.getElementById('txt-nome-ceu').innerText = "Erro de Conexão";
              alert("Erro ao carregar CEUs: " + retorno.mensagem);
            }
          })
          .catch(erro => console.log("Erro na Master: ", erro));
      });

      // 2. Transforma o Visual e Busca as Modalidades da Unidade
      function trocarCeu() {
        const idCeuSelecionado = document.getElementById('comboCeuMestre').value;
        if (!idCeuSelecionado) return;

        // Atualiza Logotipo, Nome e Endereço sem precisar buscar no servidor de novo!
        const dadosUnidade = dicionarioCEUs[idCeuSelecionado];
        document.getElementById('txt-nome-ceu').innerText = "CEU " + dadosUnidade.nome;
        
        let textoEndereco = dadosUnidade.endereco;
        if (dadosUnidade.telefone) textoEndereco += " | Tel: " + dadosUnidade.telefone;
        document.getElementById('txt-endereco-ceu').innerText = textoEndereco;

        if (dadosUnidade.logo) {
          document.getElementById('img-logo-ceu').src = dadosUnidade.logo;
        } else {
          document.getElementById('img-logo-ceu').src = "https://via.placeholder.com/150/cbd5e1/ffffff?text=SEM+FOTO";
        }

        // Limpa os filtros antigos
        document.getElementById('resultado').innerHTML = "";
        document.getElementById('comboModalidade').innerHTML = '<option value="">🎯 Modalidade (Todas)</option>';
        document.getElementById('comboNucleo').innerHTML = '<option value="">🏢 Núcleo (Todos)</option>';
        document.getElementById('comboProfessor').innerHTML = '<option value="">👨‍🏫 Professor (Todos)</option>';
        document.getElementById('comboEspaco').innerHTML = '<option value="">📍 Espaço (Todos)</option>';

        // Busca as modalidades da planilha específica desse CEU
        fetch(API_URL + "&acao=buscarCombos&idCeu=" + idCeuSelecionado)
          .then(resposta => resposta.json())
          .then(dados => preencherCombos(dados))
          .catch(erro => console.log("Erro ao carregar combos locais: ", erro));
      }

function preencherCombos(opcoes) {
        const comboMod = document.getElementById('comboModalidade');
        opcoes.modalidades.forEach(mod => comboMod.appendChild(new Option(mod, mod)));

        const comboNuc = document.getElementById('comboNucleo');
        opcoes.nucleos.forEach(nuc => comboNuc.appendChild(new Option(nuc, nuc)));

        const comboProf = document.getElementById('comboProfessor');
        opcoes.professores.forEach(prof => {
          let texto = prof.tipo !== "" ? prof.nome + " (" + prof.tipo + ")" : prof.nome;
          comboProf.appendChild(new Option(texto, prof.nome));
        });

        const comboEsp = document.getElementById('comboEspaco');
        opcoes.espacos.forEach(esp => comboEsp.appendChild(new Option(esp, esp)));

        // 🌟 INJEÇÃO DINÂMICA DAS REGRAS NO MODAL
        if (opcoes.regras) {
           // O comando replace converte as quebras de linha da planilha para exibição no site
           document.getElementById('texto-regras-documentos').innerHTML = opcoes.regras.replace(/\n/g, '<br>');
        }
      }

      function pesquisar() {
        const idCeuAtual = document.getElementById('comboCeuMestre').value;
        var termo = document.getElementById('termo').value;
        var modSelecionada = document.getElementById('comboModalidade').value;
        var nucSelecionado = document.getElementById('comboNucleo').value;
        var profSelecionado = document.getElementById('comboProfessor').value;
        var espSelecionado = document.getElementById('comboEspaco').value;
        
        if(!idCeuAtual) {
           alert("Por favor, selecione um CEU primeiro.");
           return;
        }

        if(termo.trim() === "" && diasSelecionados.length === 0 && profSelecionado === "" && modSelecionada === "" && nucSelecionado === "" && espSelecionado === "") {
           document.getElementById('resultado').innerHTML = "<div class='no-results'> </div>";
           return;
        } 

        document.getElementById('resultado').innerHTML = "<div class='loading'><i class='fas fa-spinner fa-spin me-2'></i> Buscando atividades, aguarde...</div>";
        
        // A busca envia a chave idCeu do combo mestre
        const params = new URLSearchParams({
          acao: 'buscarDados',
          idCeu: idCeuAtual,
          termo: termo,
          dias: JSON.stringify(diasSelecionados),
          prof: profSelecionado,
          mod: modSelecionada,
          nuc: nucSelecionado,
          esp: espSelecionado
        });

        fetch(API_URL + "&" + params.toString())
          .then(resposta => resposta.json())
          .then(dados => mostrarResultados(dados))
          .catch(erro => {
            document.getElementById('resultado').innerHTML = "<div class='no-results'>Erro ao carregar os dados. Tente novamente.</div>";
            console.log(erro);
          });
      }

      function mostrarResultados(dados) {
        if (dados.length == 0) {
          document.getElementById('resultado').innerHTML = "<div class='no-results'>Nenhuma turma encontrada com estes filtros. 😔 Tente outras opções!</div>";
          return;
        }

        var tabela = "<table><tr><th>Turma</th><th>Atividade</th><th>Local / Espaço</th><th>Professor(a)</th><th>Dias e Horários</th></tr>";
        
        for (var i = 0; i < dados.length; i++) {
          var turma = dados[i]; 
          var diasFormatados = turma.dias ? "<span class='badge-dias'>" + turma.dias + "</span>" : "";
          var horaFormatada = turma.horario ? "<span class='badge-hora'><i class='far fa-clock'></i> " + turma.horario + "</span>" : "";

          tabela += "<tr>" +
            "<td><strong style='color:#3182ce; font-size: 15px;'>" + (turma.turma || "-") + "</strong><br><small style='color:var(--text-muted);'>" + (turma.nucleo || "") + "</small></td>" + 
            "<td><strong style='font-size: 15px;'>" + (turma.modalidade || "-") + "</strong><br><small style='color:var(--text-muted);'>" + (turma.sufixo || "") + "</small></td>" + 
            "<td>" + (turma.espaco || "-") + "</td>" + 
            "<td>" + (turma.professor || "-") + "</td>" + 
            "<td>" + diasFormatados + "<br>" + horaFormatada + "</td>" + 
            "</tr>";
        }
        tabela += "</table>";
        document.getElementById('resultado').innerHTML = tabela;
      }
    </script>
